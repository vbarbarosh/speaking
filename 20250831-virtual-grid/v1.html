<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://unpkg.com/@vbarbarosh/smcss@1.2.0/dist/reset.css" rel="stylesheet">
    <link href="https://unpkg.com/@vbarbarosh/smcss@1.2.0/dist/sm.css" rel="stylesheet">
    <title>virtual-grid</title>
    <style>
    .gap5 { gap: 5px; }
    .gap10 { gap: 10px; }
    .gap15 { gap: 15px; }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(30px,1fr));
    }
    </style>
</head>
<body>

<div id="app"></div>

<script src="https://unpkg.com/jquery@3.7.1/dist/jquery.js"></script>
<script src="https://unpkg.com/bluebird@3.7.2/js/browser/bluebird.js"></script>
<script src="https://unpkg.com/vue@3.5.20/dist/vue.global.js"></script>
<script>

const app = Vue.createApp({
    template: `
        <div>
            <virtual-grid class="w600 h400 bs50 resize oa"></virtual-grid>
        </div>
    `,
});
app.mixin({
    methods: {
        px,
        pc,
    },
});
// vewport-width,vewport-height
// cell-width,cell-height
// virtual-width,virtual-height
app.component('virtual-grid', {
    props: ['width', 'height'],
    template: `
        <div>
            <div class="fix-br p5 m5 border">
                <pre class="xm">{{ details }}</pre>
            </div>
            <div v-bind:style="virtual_style" class="rel rainbow">
                <template v-for="row in rows">
                    <template v-for="col in cols">
                        <div v-bind:style="render_cell_style(row, col)">
                            {{row}},{{col}}
                        </div>
                    </template>
                </template>
            </div>
        </div>
    `,
    data: function () {
        return {
            tick: 0,
            rows: Array(100).fill(0).map((v,i) => i),
            cols: Array(100).fill(0).map((v,i) => i),
            cell_width: 100,
            cell_height: 100,
            client_width: null,
            client_height: null,
            scroll_x: 0,
            scroll_y: 0,
        };
    },
    computed: {
        details: function () {
            const {client_width, client_height, cell_width, cell_height} = this;
            const virtual_width = this.cols.length*cell_width;
            const virtual_height = this.rows.length*cell_height;
            const visible_x1 = Math.floor(this.scroll_x);
            const visible_y1 = Math.floor(this.scroll_y);
            const visible_x2 = Math.ceil(this.scroll_x + this.client_width);
            const visible_y2 = Math.ceil(this.scroll_y + this.client_height);
            const col_begin = Math.floor(visible_x1/cell_width);
            const col_end = Math.ceil(visible_x2/cell_width);
            const row_begin = Math.floor(visible_y1/cell_height);
            const row_end = Math.ceil(visible_y2/cell_height);
            return {
                virtual_width,
                virtual_height,
                visible_x1,
                visible_y1,
                visible_x2,
                visible_y2,
                col_begin,
                col_end,
                row_begin,
                row_end,
            };
        },
        virtual_style: function () {
            return {
                width: px(this.cols.length*this.cell_width),
                height: px(this.rows.length*this.cell_height),
            };
        },
    },
    methods: {
        refresh: function () {
            const {clientWidth, clientHeight, scrollTop, scrollLeft} = this.$el;
            this.client_width = clientWidth;
            this.client_height = clientHeight;
            this.scroll_x = scrollLeft;
            this.scroll_y = scrollTop;
        },
        render_cell_style: function (row, col) {
            return {
                position: 'absolute',
                top: px(row*this.cell_height),
                left: px(col*this.cell_width),
                width: px(this.cell_width),
                height: px(this.cell_height),
            };
        },
    },
    mounted: function () {
        this.refresh();
        this._timer = setInterval(this.refresh, 100);
    },
    unmounted: function () {
        clearInterval(this._timer);
    },
});
app.mount('#app');
function px(v) {
    return v ? `${v}px` : '0';
}
function pc(v) {
    return v ? `${v*100}%` : '0';
}
</script>

</body>
</html>
