<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://unpkg.com/@vbarbarosh/smcss@1.2.0/dist/reset.css" rel="stylesheet">
    <link href="https://unpkg.com/@vbarbarosh/smcss@1.2.0/dist/sm.css" rel="stylesheet">
    <title>virtual-grid</title>
    <style>
    .gap5 { gap: 5px; }
    .gap10 { gap: 10px; }
    .gap15 { gap: 15px; }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(30px,1fr));
    }
    </style>
</head>
<body>

<div id="app"></div>

<script src="https://unpkg.com/jquery@3.7.1/dist/jquery.js"></script>
<script src="https://unpkg.com/bluebird@3.7.2/js/browser/bluebird.js"></script>
<script src="https://unpkg.com/vue@3.5.20/dist/vue.global.js"></script>
<script>

const app = Vue.createApp({
    template: `
        <div>
            <virtual-grid :items :getcellsize class="w500 h400 bs50 resize oa">
                <template v-slot="slot">
                    <div v-bind:style="slot.style">
                        {{ slot.cell.item }}
                    </div>
                </template>
            </virtual-grid>
        </div>
    `,
    data: function () {
        return {
            items: Array(9998).fill(0).map((v,i) => ({id: i})),
        };
    },
    methods: {
        getcellsize: function (client_width) {
            const cols = Math.floor(client_width/100);
            const width = client_width/cols;
            const height = width;
            return [width, height, cols];
        },
    },
});
app.mixin({
    methods: {
        px,
        pc,
    },
});
app.component('virtual-grid', {
    props: ['items', 'getcellsize'],
    template: `
        <div>
            <div class="fix-br z1 p5 m5 white border">
                <pre class="xm">{{ {...details, cells: details.cells.length} }}</pre>
            </div>
            <div v-bind:style="virtual_style" class="rel rainbow">
                <template v-for="cell in details.cells" v-bind:key="cell.key">
                    <slot v-bind:style="render_cell_style(cell)" v-bind:cell="cell">
                        <div v-bind:style="render_cell_style(cell)">
                            {{ cell }}
                        </div>
                    </slot>
                </template>
            </div>
        </div>
    `,
    data: function () {
        return {
            rows: null,
            cols: null,
            cell_width: null,
            cell_height: null,
            client_width: null,
            client_height: null,
            scroll_x: null,
            scroll_y: null,
        };
    },
    computed: {
        details: function () {
            const {rows, cols, client_width, client_height, scroll_x, scroll_y, cell_width, cell_height} = this;
            const virtual_width = cols*cell_width;
            const virtual_height = rows*cell_height;
            const visible_x1 = Math.floor(scroll_x);
            const visible_y1 = Math.floor(scroll_y);
            const visible_x2 = Math.ceil(scroll_x + client_width);
            const visible_y2 = Math.ceil(scroll_y + client_height);
            const col_begin = Math.floor(visible_x1/cell_width);
            const col_end = Math.ceil(visible_x2/cell_width);
            const row_begin = Math.floor(visible_y1/cell_height);
            const row_end = Math.ceil(visible_y2/cell_height);
            const cells = [];
            const extra_rows = Math.ceil(client_height/cell_height);
            const extra_colls = Math.ceil(client_height/cell_height);
            for (let row = Math.max(0, row_begin - extra_rows), end = Math.min(rows, row_end + extra_rows); row < end; ++row) {
                for (let col = Math.max(0, col_begin - extra_colls), end2 = Math.min(cols, col_end + extra_colls); col < col_end; ++col) {
                    const i = row*cols + col;
                    if (i < this.items.length) {
                        const key = `${row}-${col}`;
                        const item = this.items[i];
                        cells.push({key, row, col, item});
                    }
                }
            }
            return {
                virtual_width,
                virtual_height,
                visible_x1,
                visible_y1,
                visible_x2,
                visible_y2,
                col_begin,
                col_end,
                row_begin,
                row_end,
                cells,
            };
        },
        virtual_style: function () {
            return {
                width: px(this.cols*this.cell_width),
                height: px(this.rows*this.cell_height),
            };
        },
    },
    methods: {
        refresh: function () {
            const {clientWidth, clientHeight, scrollTop, scrollLeft} = this.$el;
            this.client_width = clientWidth;
            this.client_height = clientHeight;
            this.scroll_x = scrollLeft;
            this.scroll_y = scrollTop;
            const [cell_width, cell_height, cols] = this.getcellsize(clientWidth);
            this.cell_width = cell_width;
            this.cell_height = cell_height;
            this.cols = cols;
            this.rows = Math.ceil(this.items.length/cols);
        },
        render_cell_style: function (cell) {
            const {row, col} = cell;
            const x = px(col*this.cell_width);
            const y = px(row*this.cell_height);
            return {
                position: 'absolute',
                transform: `translate(${x}, ${y})`,
                width: px(this.cell_width),
                height: px(this.cell_height),
            };
        },
    },
    mounted: function () {
        this.refresh();
        this.$el.addEventListener('scroll', this.refresh, {passive: true});
        this._observer = new ResizeObserver(this.refresh);
        this._observer.observe(this.$el);
    },
    unmounted: function () {
        this.$el.removeEventListener('scroll', this.refresh);
        this._observer.unobserve(this.$el);
    },
});
app.mount('#app');
function px(v) {
    return v ? `${v}px` : '0';
}
function pc(v) {
    return v ? `${v*100}%` : '0';
}
</script>

</body>
</html>
